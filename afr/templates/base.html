<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{% block title %}Agent Flight Recorder{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Consolas, "Courier New", monospace; background: #14161a;
         color: #cdd3dd; padding: 18px; font-size: 13px; }
  a { color: #7ab0ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 15px; margin-bottom: 12px; color: #e8ecf2; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #2a2f37; padding: 5px 9px; text-align: left; }
  th { background: #1b1f25; color: #9aa4b2; font-weight: 600; }
  .ok { color: #7fd18a; } .failed { color: #ff7a7a; font-weight: 700; }
  .warn { color: #e8c268; }
  pre { background: #0f1114; border: 1px solid #2a2f37; padding: 8px;
        overflow-x: auto; font-size: 12px; white-space: pre-wrap; }
  .bar { display: inline-block; border: 1px solid #3a4150; padding: 2px 8px;
         margin: 2px 6px 2px 0; background: #1b1f25; }
  .bar.fail { border: 1px dashed #ff7a7a; }
  .arrow { color: #566072; }
  details { margin: 4px 0; }
  summary { cursor: pointer; color: #9aa4b2; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .muted { color: #727d8c; }
  .diverge { border: 2px dashed #e8c268; padding: 6px 10px; margin: 6px 0; }
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
