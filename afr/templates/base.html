<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{% block title %}traces · afr{% endblock %}</title>
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== 设计令牌：提取自 LangSmith 官方 CSS（apac.smith.langchain.com
         资产包 index-D5_KzS3r.css，浅色主题），2026-09-26。色板/圆角/阴影
         逐项对齐原值；等宽字体原站用 Fira Code ===== */
  :root {
    --brand-25: #e5f4ff;  --brand-50: #cce9ff;  --brand-200: #145095;
    --brand-400: #006ddd; --brand-500: #1566b8; --brand-600: #145095;
    --green-25: #f5fef9;  --green-50: #ecfdf3;  --green-300: #75e0a7;
    --green-500: #46cd89; --green-600: #079455;
    --red-25: #fef3f2;    --red-100: #fee4e2;   --red-600: #d92d20;
    --yellow-50: #fffaeb; --yellow-600: #d97706;
    --orange-500: #f79009;
    --purple-50: #f4f3ff; --purple-500: #8b71cc; --purple-600: #6244a0;
    --n-25: #fafbfd; --n-35: #f8fafc; --n-50: #f5f8fb; --n-100: #edf2f7;
    --n-200: #e2e8f0; --n-300: #cbd5e1; --n-400: #94a3b8; --n-500: #64748b;
    --n-600: #475569; --n-700: #334155; --n-800: #1e293b; --n-900: #0f172a;
    --r-xs: 3px; --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 12px;
    --shadow-sm: 0 1px 3px #1018281a, 0 1px 2px #1018280f;
    --shadow-md: 0 4px 6px -1px #1018281a, 0 2px 4px -1px #1018280f;
    --font-ui: Inter, "Noto Sans SC", -apple-system, "Segoe UI",
               "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "Fira Code", ui-monospace, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font-ui); background: var(--n-35);
         color: var(--n-900); font-size: 13px; line-height: 1.45;
         display: flex; flex-direction: column;
         -webkit-font-smoothing: antialiased; }
  .num, .wf-lat, .wf-tok, .chip { font-variant-numeric: tabular-nums;
           font-feature-settings: "tnum" 1; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--n-300); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--n-400); }

  /* 顶栏 */
  header { display: flex; align-items: center; gap: 14px; padding: 0 16px;
           height: 48px; flex: none; background: #fff;
           border-bottom: 1px solid var(--n-200);
           box-shadow: var(--shadow-sm); z-index: 10; }
  header h1 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  header .db { color: var(--n-400); font-size: 12px;
               font-family: var(--font-mono); }
  nav { display: flex; gap: 2px; margin-left: 8px; }
  nav a { color: var(--n-700); text-decoration: none; font-size: 12.5px;
          font-weight: 500; padding: 5px 10px; border-radius: var(--r-md);
          transition: background .12s; }
  nav a:hover { background: var(--n-100); }
  nav a.on { background: var(--brand-25); color: var(--brand-600); }

  main { display: flex; flex: 1; min-height: 0; }

  /* 左栏：执行列表 */
  #list { width: 460px; min-width: 340px; flex: none; background: #fff;
          border-right: 1px solid var(--n-200); overflow-y: auto; }
  .list-head { position: sticky; top: 0; background: var(--n-25); z-index: 2;
               display: grid; grid-template-columns: 26px 1fr 78px 56px 62px;
               gap: 6px; padding: 7px 14px; font-size: 11px; font-weight: 600;
               color: var(--n-500); border-bottom: 1px solid var(--n-200);
               letter-spacing: .02em; }
  .row { display: grid; grid-template-columns: 26px 1fr 78px 56px 62px;
         gap: 6px; padding: 8px 14px; cursor: pointer; align-items: center;
         border-bottom: 1px solid var(--n-100); transition: background .1s; }
  .row:hover { background: var(--n-50); }
  .row.sel { background: var(--brand-50);
             box-shadow: inset 3px 0 0 var(--brand-500); }
  .st { width: 16px; height: 16px; }
  .row .name { overflow: hidden; min-width: 0; font-weight: 500;
               white-space: nowrap; }
  .row .prev { display: block; color: var(--n-400); font-size: 11px;
               font-weight: 400; overflow: hidden; text-overflow: ellipsis;
               white-space: nowrap; font-family: var(--font-ui); }
  .row .prev.out { color: var(--n-300); }
  .lat-y { color: var(--yellow-600) !important; }
  .lat-r, .slow-red { color: var(--red-600); font-weight: 600; }
  .clk { width: 11px; height: 11px; vertical-align: -1px; margin-right: 3px;
         color: var(--green-600); }
  .lat-y .clk { color: var(--yellow-600); }
  .lat-r .clk { color: var(--red-600); }
  .row .sub { color: var(--n-400); font-size: 11px; font-weight: 400;
              font-family: var(--font-mono); }
  .row .num { color: var(--n-500); font-size: 12px; text-align: right;
              font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 右栏 */
  #detail { flex: 1; overflow-y: auto; padding: 16px 20px; background: var(--n-35); }

  /* 徽章 / 芯片 */
  .badge { display: inline-flex; align-items: center; font-size: 11px;
           font-weight: 600; padding: 1px 8px; border-radius: var(--r-sm);
           border: 1px solid transparent; line-height: 16px; }
  .badge.ok { background: var(--green-50); color: var(--green-600);
              border-color: #b9e6ca; }
  .badge.failed { background: var(--red-25); color: var(--red-600);
                  border-color: #fbd5d2; }
  .badge.replaying { background: var(--yellow-50); color: var(--yellow-600);
                     border-color: #fedf89; }
  .tokchip { font-size: 11px; color: var(--n-500); background: var(--n-100);
             border-radius: 9999px; padding: 1px 8px;
             font-variant-numeric: tabular-nums; }
  .tag { display: inline-flex; align-items: center; font-size: 10.5px;
         font-weight: 600; padding: 1px 7px; border-radius: var(--r-sm);
         letter-spacing: .02em; }
  .tag.llm { background: var(--green-50); color: var(--green-600); }
  .tag.tool { background: var(--purple-50); color: var(--purple-600); }
  .tag.node { background: var(--brand-25); color: var(--brand-600); }

  /* 瀑布时间轴（仿 LangSmith trace waterfall：平铺行 + 全宽轨道 + 起点定位） */
  .panel { background: #fff; border: 1px solid var(--n-200);
           border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
           overflow: hidden; }
  .wf-head { display: grid;
             grid-template-columns: minmax(170px,26%) 60px 62px 70px minmax(260px,1fr);
             gap: 10px; padding: 7px 14px; background: var(--n-25);
             border-bottom: 1px solid var(--n-200); font-size: 11px;
             font-weight: 600; color: var(--n-500); letter-spacing: .02em; }
  .wf-head .c { text-align: right; }
  .wf-head .track-h { text-align: left; }
  .wf-row { border-bottom: 1px solid var(--n-100); }
  .wf-row:last-child { border-bottom: none; }
  .wf-row > summary { list-style: none; }
  .wf-row > summary::-webkit-details-marker { display: none; }
  .wf-line { display: grid;
             grid-template-columns: minmax(170px,26%) 60px 62px 70px minmax(260px,1fr);
             gap: 10px; align-items: center; padding: 7px 14px;
             cursor: pointer; transition: background .1s; }
  .wf-line:hover { background: var(--n-50); }
  .wf-row.sub .wf-line { padding-top: 5px; padding-bottom: 5px; }
  .wf-name { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .wf-name .nm { overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; font-weight: 500; font-size: 12.5px; }
  .wf-row.sub .nm { font-weight: 400; color: var(--n-700); }
  .caret { flex: none; width: 0; height: 0;
           border-left: 5px solid var(--n-400);
           border-top: 4px solid transparent;
           border-bottom: 4px solid transparent;
           transition: transform .12s; }
  .wf-row[open] > summary .caret { transform: rotate(90deg); }
  .ic { flex: none; width: 18px; height: 18px; border-radius: var(--r-sm);
        color: #fff; font-size: 11px; line-height: 1;
        display: inline-flex; align-items: center; justify-content: center; }
  .ic-node { background: var(--brand-500); }
  .ic-llm { background: var(--purple-600); font-size: 10px; }
  .ic-tool { background: var(--orange-500); font-size: 10px; }
  .wf-lat, .wf-tok { text-align: right; color: var(--n-500); font-size: 12px;
                    font-variant-numeric: tabular-nums; }
  .wf-tok { color: var(--n-400); }
  .track { position: relative; height: 14px; overflow: hidden;
           background-image:
             linear-gradient(90deg, transparent calc(25% - 1px),
               #f1f5f9 calc(25% - 1px), #f1f5f9 25%, transparent 25%),
             linear-gradient(90deg, transparent calc(50% - 1px),
               #f1f5f9 calc(50% - 1px), #f1f5f9 50%, transparent 50%),
             linear-gradient(90deg, transparent calc(75% - 1px),
               #f1f5f9 calc(75% - 1px), #f1f5f9 75%, transparent 75%); }
  .bar { position: absolute; top: 3px; height: 8px;
         min-width: 3px; background: var(--brand-500); border-radius: 2px;
         transition: background .1s; }
  .wf-line:hover .bar { background: var(--brand-600); }
  .bar.err { background: var(--red-600); }
  .bar-llm { background: var(--purple-500); }
  .wf-line:hover .bar-llm { background: var(--purple-600); }
  .wf-kids { margin-left: 20px; border-left: 1px solid var(--n-200); }
  .wf-detail { padding: 6px 14px 10px 34px; background: var(--n-25);
               border-top: 1px solid var(--n-100); }
  .wf-row.sub .wf-detail { padding-left: 30px; }
  .sub-note { color: var(--n-400); font-size: 12px; }
  /* 输入/输出面板（仿 LangSmith peek 视图的 IO 区） */
  .io-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            margin-bottom: 12px; }
  .io-card { background: #fff; border: 1px solid var(--n-200);
             border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
             padding: 10px 14px; min-width: 0; }
  .io-card .mc-head { margin-bottom: 6px; }
  .io-card pre { max-height: 220px; overflow-y: auto; margin: 0; }
  /* 详情头部 */
  .detail-title { display: flex; align-items: center; gap: 10px;
                  margin-bottom: 6px; }
  .detail-title .t { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .meta-chips { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 5px;
          font-size: 12px; color: var(--n-500);
          font-variant-numeric: tabular-nums; }
  .chip b { color: var(--n-900); font-weight: 600; font-family: var(--font-mono);
            font-size: 11.5px; }

  /* 消息卡片 */
  .cards { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
  .msgcard { border: 1px solid var(--n-200); border-left: 3px solid var(--brand-500);
             border-radius: var(--r-md); padding: 7px 11px; background: #fff; }
  .msgcard.user { border-left-color: var(--brand-400); }
  .msgcard.ai { border-left-color: var(--green-500); }
  .msgcard.tool { border-left-color: var(--purple-600); }
  .msgcard.err { border-left-color: var(--red-600);
                 background: var(--red-25); }
  .mc-head { font-size: 11px; font-weight: 600; color: var(--n-500);
             margin-bottom: 3px; text-transform: none;
             letter-spacing: .03em; display: flex; align-items: center;
             gap: 6px; }
  .mc-icon { flex: none; width: 16px; height: 16px; border-radius: var(--r-sm);
             display: inline-flex; align-items: center; justify-content: center; }
  .mc-icon svg { width: 11px; height: 11px; }
  .mi-user { background: var(--brand-500); }
  .mi-ai { background: #f79009; }
  .mi-tool { background: var(--purple-600); }
  .mi-sys { background: var(--n-400); }
  /* LLM Attributes 表（仿 LangSmith：key 灰左列 / value 右列 / 细分组） */
  .attr-wrap { margin: 8px 0 4px; border: 1px solid var(--n-200);
               border-radius: var(--r-lg); overflow: hidden; background: #fff; }
  .attr-group { padding: 6px 12px; font-size: 11.5px; font-weight: 600;
                color: var(--n-700); background: var(--n-25);
                border-bottom: 1px solid var(--n-100); }
  table.attr-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.attr-table td { padding: 5px 12px; border-bottom: 1px solid var(--n-50);
                        vertical-align: top; }
  table.attr-table tr:last-child td { border-bottom: none; }
  table.attr-table td.k { width: 42%; color: var(--n-400);
                          font-family: var(--font-mono); font-size: 11.5px; }
  table.attr-table td.v { color: var(--n-900); word-break: break-all; }
  .mc-body { font-size: 12.5px; white-space: pre-wrap; word-break: break-all;
             color: var(--n-900); }
  .mc-tool { margin: 4px 0; }
  pre, pre.kv { background: var(--n-50); border: 1px solid var(--n-100);
                border-radius: var(--r-md); padding: 8px 10px; font-size: 12px;
                font-family: var(--font-mono); overflow-x: auto;
                white-space: pre-wrap; margin: 6px 0; color: var(--n-700); }
  details { margin: 2px 0; }
  summary { cursor: pointer; color: var(--n-500); font-size: 12px;
            font-weight: 500; user-select: none; }
  summary:hover { color: var(--brand-600); }
  .errbox { background: var(--red-25); border: 1px solid var(--red-100);
            color: var(--red-600); border-radius: var(--r-lg);
            padding: 9px 13px; margin: 8px 0; font-family: var(--font-mono);
            font-size: 12px; white-space: pre-wrap; }
  .empty { color: var(--n-400); padding: 48px; text-align: center;
           font-size: 13px; }
  a { color: var(--brand-500); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* 概览页 */
  .cards-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .stat-card { border: 1px solid var(--n-200); border-radius: var(--r-lg);
               background: #fff; padding: 10px 16px; min-width: 150px;
               box-shadow: var(--shadow-sm); }
  .stat-card .mc-head { margin-bottom: 4px; }
  .stat-card .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
                  font-variant-numeric: tabular-nums; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px;
               background: #fff; border: 1px solid var(--n-200);
               border-radius: var(--r-lg); overflow: hidden;
               box-shadow: var(--shadow-sm); }
  table.grid th { text-align: left; padding: 7px 10px; font-size: 11px;
                  font-weight: 600; color: var(--n-500); background: var(--n-25);
                  border-bottom: 1px solid var(--n-200);
                  letter-spacing: .02em; }
  table.grid td { padding: 6px 10px; border-bottom: 1px solid var(--n-50);
                  font-variant-numeric: tabular-nums; }
  table.grid tr:last-child td { border-bottom: none; }
  table.grid tbody tr:hover td { background: var(--n-50); }
  .banner { background: var(--red-25); color: var(--red-600);
            border-bottom: 1px solid var(--red-100); padding: 7px 16px;
            font-size: 12.5px; flex: none; }
  h3.sec { font-size: 12px; font-weight: 600; color: var(--n-500);
           text-transform: uppercase; letter-spacing: .04em;
           margin: 18px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Agent Flight Recorder</h1>
  <span class="db">{{ db }}</span>
  <nav>
    <a href="/" class="{{ 'on' if not status }}">全部</a>
    <a href="/?status=failed" class="{{ 'on' if status == 'failed' }}">失败</a>
    <a href="/?status=ok" class="{{ 'on' if status == 'ok' }}">成功</a>
    <a href="/stats">概览</a>
  </nav>
</header>
{% if banner_fails %}
<div class="banner">
  ⚠ 最近 50 次执行中有 <b>{{ banner_fails }}</b> 次失败
  <a href="/?status=failed">查看失败列表</a> · <a href="/stats">监控概览</a>
</div>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
