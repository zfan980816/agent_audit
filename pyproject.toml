[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-flight-recorder"
version = "0.1.0"
description = "Flight recorder + run-diff + deterministic replay for LangGraph multi-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langchain-core>=0.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
]

[project.optional-dependencies]
demo = ["langgraph>=0.2"]
mysql = ["PyMySQL>=1.1"]
dm = ["dmpython>=2.4"]  # 达梦官方驱动在安装介质 drivers/python 里，PyPI 版为非官方轮子
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
rec = "afr.cli:main"

[tool.setuptools.packages.find]
include = ["afr*"]

[tool.setuptools.package-data]
afr = ["templates/*.html"]
