name: CI
on: [push, pull_request]
jobs:
  # Python v0.1.1 is FROZEN as the porting reference — one guard run is all it
  # needs (was 3 OS x 2 Py = 6 runs for unchanged code). The TS line (node
  # job below) is the canonical implementation.
  python-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm --prefix npm ci
      - run: npm --prefix npm test
      - run: npm --prefix npm run build
      - name: Demo JSON smoke
        run: node npm/dist/cli.js --demo --json | node -e "JSON.parse(require('fs').readFileSync(0,'utf8'))"
